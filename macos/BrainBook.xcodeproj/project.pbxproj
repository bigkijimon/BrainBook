			shellScript = "# Copy server files, dist, and other resources to app bundle -- match build-app.sh exactly\nset -euo pipefail\nAPP_RES=\"${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}/Contents/Resources\"\nAPP_APP=\"${APP_RES}/app\"\nREPO_ROOT=\"${SRCROOT}/..\"\n\n# Create app directory\nmkdir -p \"${APP_APP}/data\"\n\n# Copy server files -- EXACT list from build-app.sh\ncp \"${REPO_ROOT}\"/*.mjs \"${APP_APP}/\"\ncp \"${REPO_ROOT}\"/office-map.json \"${APP_APP}/\"\ncp \"${REPO_ROOT}\"/pty-host.py \"${APP_APP}/\"\ncp \"${REPO_ROOT}\"/agent-feed.py \"${APP_APP}/\"\ncp \"${REPO_ROOT}\"/package.json \"${APP_APP}/\"\n\n# Copy dist folder -- copy CONTENTS to avoid nested dist/dist\n# rm first: cp -R merged into the previous build, so stale hashed assets piled up and the ship.sh hash check failed (2026-10-14)\nrm -rf \"${APP_APP}/dist\"\nmkdir -p \"${APP_APP}/dist\"\ncp -R \"${REPO_ROOT}/dist/\"* \"${APP_APP}/dist/\"\n";
